kind = "web"
previewPath = "/"
title = "رفيق كبار السن"
version = "1.0.0"
id = "artifacts/senior-companion"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20766

[services.development]
run = "pnpm --filter @workspace/senior-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/senior-companion", "run", "build" ]
publicDir = "artifacts/senior-companion/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20766"
BASE_PATH = "/"
